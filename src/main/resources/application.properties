spring.application.name=takeHomeChallenge
server.port=8085
server.error.include-message=always

# ========= DATASOURCE (MySQL) =========
spring.datasource.url=jdbc:mysql://localhost:3306/THC?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========= JPA / HIBERNATE =========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate=warn
logging.level.org.hibernate.orm.connections.pooling=error
logging.level.org.hibernate.SQL=off

